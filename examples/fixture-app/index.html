<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fixture · Dashboard</title>
<style>
  body { margin: 0; font: 15px/1.5 system-ui, sans-serif; color: #16181d; }
  header { display: flex; align-items: center; gap: 1rem; padding: 1rem 1.5rem; border-bottom: 1px solid #e3e6ec; }
  h1 { font-size: 1.1rem; margin: 0; }
  main { padding: 1.5rem; max-width: 40rem; }
  .card { border: 1px solid #e3e6ec; border-radius: 8px; padding: 1rem; margin-bottom: 1rem; }
  button { font: inherit; padding: .45rem .9rem; border: 0; border-radius: 6px; background: #2b59d8; color: #fff; cursor: pointer; }
  /* A sticky footer that can be made to swallow the primary action. */
  footer { position: fixed; left: 0; right: 0; bottom: 0; padding: .75rem 1.5rem; background: #f4f6fa; border-top: 1px solid #e3e6ec; }
  /* Relative timestamps are genuinely unstable and are meant to be masked. */
  .relative-time { color: #5b6270; font-size: .85rem; }
</style>
<style id="injected-defect">{{BREAK_STYLE}}</style>
</head>
<body data-testid="app-root">
<header>
  <h1>Fixture</h1>
  <nav><a href="/settings">Settings</a></nav>
</header>
<main>
  <div class="card">
    <h2>Your projects</h2>
    <p>Three projects, none of them real.</p>
    <p class="relative-time" data-testid="updated">updated <span id="ago">just now</span></p>
    <button data-testid="save" data-autoqa-safe="true">Save</button>
  </div>
</main>
<footer>Fixture footer</footer>
<script>
  // Deliberate non-determinism. The determinism contract freezes Date and
  // Math.random before this runs, so these must render identically every time.
  document.getElementById('ago').textContent = new Date().toISOString();
  if (Math.random() > 2) document.body.style.filter = 'invert(1)';
</script>
</body>
</html>
