# AutoQA on the Nebula mobile app (React Native, Expo dev client) on the booted
# iOS simulator, against the deployed dev backend.
#
# nebula-mobile's own E2E scripts mint a session through /auth/test-login and
# print a deep link that installs it. AutoQA captures the link as a secret: the
# explorer sees only {{E2E_LOGIN_LINK}}, and the driver opens the real link.
version: 1

app:
  platform: ios
  source: ../../../nebula-mobile
  setup:
    # Start Metro for this checkout on 8082. A reused server may serve another checkout.
    - run: CI=1 exec npx expo start --port 8082
      cwd: ../../../nebula-mobile
      background: true
      readyWhen: 'METRO-READY|Waiting on http'
      timeoutMs: 180000
    - run: pnpm -s e2e:mint
      cwd: ../../../nebula-mobile
      capture:
        E2E_LOGIN_LINK: 'E2E_LOGIN_LINK=(\S+)'
    # Start logged out: the auth token lives in the Keychain, which survives an
    # app-data clear.
    - run: bash scripts/e2e/reset-ios.sh
      cwd: ../../../nebula-mobile
    - run: xcrun simctl openurl booted "nebula://expo-development-client/?url=http%3A%2F%2Flocalhost%3A8082" && sleep 20
  teardown: []
  connect:
    appId: gg.nebula-dev
  instructions: instructions.md

agents:
  explorer:
    maxSteps: 80
    budgetUsd: 0.5
    use: { runtime: model, via: openrouter, model: z-ai/glm-5.3-flash }
  judge:
    use: { runtime: model, via: openrouter, model: z-ai/glm-5.3-flash }
  fixer:
    enabled: true
    retest: { prepare: pnpm install --frozen-lockfile --prefer-offline }
    # The fixer edits files in its own git worktree. It may install
    # dependencies and run the checks, and nothing else in the shell.
    use:
      runtime: cli
      command: >-
        claude -p --permission-mode acceptEdits
        --allowedTools "Bash(pnpm:*)" "Bash(git diff:*)" "Bash(git status:*)"

decisions:
  decider: jev
