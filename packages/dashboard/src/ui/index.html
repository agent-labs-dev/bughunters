<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AutoQA</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="mark" aria-hidden="true"></span>
    <strong id="project-name">AutoQA</strong>
  </div>
  <nav class="tabs" id="tabs">
    <button data-view="overview" class="active">Overview</button>
    <button data-view="issues">Issues</button>
    <button data-view="activity">Activity</button>
    <button data-view="screens">Screens</button>
    <button data-view="memory">Memory</button>
    <button data-view="checks">Checks</button>
  </nav>
  <div class="status">
    <span id="live" class="live" title="Live connection to the local watcher">live</span>
    <span id="platform" class="muted"></span>
    <span id="patrol" class="pill"></span>
  </div>
</header>

<main id="view"></main>

<div id="lightbox" class="lightbox" hidden>
  <button class="lightbox-close" aria-label="Close">&times;</button>
  <img id="lightbox-img" alt="">
  <p id="lightbox-caption"></p>
</div>

<script type="module" src="/app.js"></script>
</body>
</html>
