name: Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Explicit stable version (reuse the same version to resume)'
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: bughunters-release
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      id-token: write
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: npm install -g npm@12.1.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @bughunters/capture exec playwright install --with-deps chromium
      - run: pnpm test
      - run: node --test scripts/release.test.mjs
      - name: Prepare versioned distribution from Verified source
        run: node scripts/release.mjs prepare
      - run: pnpm --filter bughunters build
      - run: pnpm test:package
      - name: Pack the exact release artifact
        run: npm pack ./packages/bughunters --pack-destination /tmp
      - name: Reserve source tag, publish with provenance, and finish GitHub release
        run: node scripts/release.mjs publish "/tmp/bughunters-${RELEASE_VERSION}.tgz"
