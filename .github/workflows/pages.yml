# Publishes the landing page in site/ to GitHub Pages. The page is plain HTML
# and CSS with no build, so the job only stages it next to the brand assets,
# which stay in assets/ so the README and the site share one copy.
name: Pages

on:
  push:
    branches: [main]
    paths: ['site/**', 'assets/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p _site/assets
          cp -r site/. _site/
          cp assets/logo.svg assets/dashboard.png assets/social-preview.png _site/assets/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
