name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      # No `version:` here: it is read from package.json's packageManager,
      # and pinning it twice makes the action refuse to run at all.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # The npm package is a bundle of the workspace, so a break in the bundle
      # must fail here, not in a release.
      - run: pnpm --filter bughunters build
      - run: node packages/bughunters/dist/bin.js --version
      # The capture tests drive a real browser, because font loading and layout
      # only mean anything against a real rendering engine.
      - run: pnpm --filter @bughunters/capture exec playwright install --with-deps chromium
      - run: pnpm test
      - run: node --test scripts/release.test.mjs
      - run: pnpm test:package

  worker-isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: docker pull node:22-bookworm-slim
      - run: pnpm exec vitest run packages/agents/src/worker.test.ts
        env:
          BUGHUNTERS_DOCKER_TEST: '1'
