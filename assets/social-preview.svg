<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <linearGradient id="bn-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#151a33"/>
      <stop offset="1" stop-color="#070914"/>
    </linearGradient>
    <pattern id="bn-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <radialGradient id="bn-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a3e635" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#a3e635" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="640" fill="url(#bn-bg)"/>
  <rect width="1280" height="640" fill="url(#bn-grid)"/>
  <circle cx="250.0" cy="320.0" r="237.5" fill="url(#bn-glow)"/>
  <g transform="translate(90 160) scale(1.25)">
  <defs>
    <linearGradient id="bh-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c2140"/>
      <stop offset="1" stop-color="#0a0d1a"/>
    </linearGradient>
    <linearGradient id="bh-lime" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9f99d"/>
      <stop offset="1" stop-color="#65a30d"/>
    </linearGradient>
    <radialGradient id="bh-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#bef264" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#bef264" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="256" height="256" rx="56" fill="url(#bh-bg)"/>
  <circle cx="128" cy="138" r="84" fill="url(#bh-glow)"/>
  <!-- The viewfinder: Bughunters looks at the app the way a tester does. -->
  <g fill="none" stroke="#f8fafc" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" opacity="0.92">
    <path d="M50 94V66a16 16 0 0 1 16-16h28"/>
    <path d="M162 50h28a16 16 0 0 1 16 16v28"/>
    <path d="M206 162v28a16 16 0 0 1-16 16h-28"/>
    <path d="M94 206H66a16 16 0 0 1-16-16v-28"/>
  </g>
  <!-- The bug: a head and a shell in two halves. -->
  <circle cx="128" cy="84" r="14" fill="url(#bh-lime)"/>
  <path d="M122 106C98 109 82 127 82 150C82 172 99 188 122 191Z" fill="url(#bh-lime)"/>
  <path d="M134 106C158 109 174 127 174 150C174 172 157 188 134 191Z" fill="url(#bh-lime)"/>
</g>
  <g font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="460" y="290" fill="#f8fafc" font-size="100" font-weight="800" letter-spacing="-2">bug<tspan fill="#bef264">hunters</tspan></text>
    <text x="464" y="352.0" fill="#cbd5e1" font-size="28.999999999999996" font-weight="500">AI agents that explore your app, find bugs, and fix them.</text>
    <rect x="460" y="382.0" width="462.00" height="62.0" rx="14.000000000000002" fill="#0b0f1f" stroke="#bef264" stroke-opacity="0.5" stroke-width="2"/>
    <text x="482.0" y="423.0" fill="#bef264" font-size="30.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">$ <tspan fill="#f8fafc">npx bughunters patrol</tspan></text>
  </g>
</svg>
